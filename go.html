<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>App Store を開く</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background: #0a0603; color: #fff3e8;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; padding: 40px 24px;
    text-align: center; line-height: 1.7;
  }
  .wrap { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid rgba(255, 150, 60, 0.25); border-top-color: #ff7a1a;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .app-name { font-size: 19px; font-weight: 900; letter-spacing: 0.04em; }
  .lead { font-size: 13.5px; color: rgba(255, 214, 170, 0.72); }

  .btn {
    display: block; width: 100%; padding: 16px 20px;
    border-radius: 13px; text-decoration: none; font-weight: 700; font-size: 16px;
    background: linear-gradient(135deg, #ff7a1a, #ffb347); color: #1a0d04;
    border: none; cursor: pointer; font-family: inherit;
  }
  .btn.sub {
    background: rgba(46, 24, 10, 0.6); color: #fff3e8;
    border: 1px solid rgba(255, 150, 60, 0.3); font-size: 14px; padding: 13px 20px;
  }

  .hint {
    width: 100%; text-align: left; font-size: 12.5px;
    color: rgba(255, 214, 170, 0.6);
    background: rgba(46, 24, 10, 0.45); border: 1px solid rgba(255, 150, 60, 0.18);
    border-radius: 12px; padding: 14px 16px;
  }
  .hint b { color: #ffb347; font-weight: 700; }
  .url {
    width: 100%; font-size: 11.5px; word-break: break-all;
    color: rgba(255, 214, 170, 0.5);
    background: rgba(0,0,0,0.3); border-radius: 9px; padding: 10px 12px;
  }
  .back { font-size: 12px; color: rgba(255, 214, 170, 0.45); text-decoration: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- 転送を試している間の表示 -->
    <div id="loading">
      <div class="spinner"></div>
      <p class="lead" style="margin-top:16px">App Store を開いています…</p>
    </div>

    <!-- 自動で開けなかった場合の案内 -->
    <div id="fallback" class="wrap hidden">
      <div class="app-name" id="appName">App Store</div>
      <p class="lead" id="lead">下のボタンで開かない場合は、<br>ブラウザで開くと確実です。</p>

      <a class="btn" id="openBtn" href="https://apps.apple.com/jp/">App Store を開く</a>

      <div class="hint" id="hint">
        <b>開かないときは</b><br>
        Instagram などのアプリ内ブラウザは App Store を開けないことがあります。
        画面の <b>…</b> メニューから <b>「ブラウザで開く」</b>（Safari で開く）を選んでから、
        もう一度お試しください。
      </div>

      <button class="btn sub" id="copyBtn">リンクをコピー</button>
      <div class="url" id="urlText"></div>
    </div>

    <a class="back" href="./">← リンク集に戻る</a>
  </div>

  <script>
    // Instagram 等のアプリ内ブラウザは apps.apple.com への遷移を経路によらず
    // 拒否することがある (タップ・JS 転送のいずれも通らない)。
    // ここでは まず転送を試し、開けなかった場合に手動の導線と案内を出す。
    //
    // 飛び先を自由に指定できるとリダイレクトを悪用されるので、
    // 下のホワイトリストに限定する。
    var APPS = {
      hidamari:  { name: 'ひだまり',    url: 'https://apps.apple.com/jp/app/id6777024010' },
      arpinnavi: { name: 'ARピンナビ',  url: 'https://apps.apple.com/jp/app/id6777624623' },
      lokashare: { name: 'LokaShare',  url: 'https://apps.apple.com/jp/app/id6769671951' }
    };

    var key = new URLSearchParams(location.search).get('app');
    var app = Object.prototype.hasOwnProperty.call(APPS, key) ? APPS[key] : null;

    var loading  = document.getElementById('loading');
    var fallback = document.getElementById('fallback');

    function showFallback() {
      loading.classList.add('hidden');
      fallback.classList.remove('hidden');
    }

    if (!app) {
      document.getElementById('appName').textContent = 'リンクが見つかりません';
      ['lead', 'openBtn', 'hint', 'copyBtn'].forEach(function (id) {
        document.getElementById(id).classList.add('hidden');
      });
      showFallback();
    } else {
      document.getElementById('appName').textContent = app.name;
      document.getElementById('openBtn').setAttribute('href', app.url);
      document.getElementById('urlText').textContent = app.url;

      document.getElementById('copyBtn').addEventListener('click', function () {
        var btn = this;
        function done() { btn.textContent = 'コピーしました'; setTimeout(function () { btn.textContent = 'リンクをコピー'; }, 1800); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(app.url).then(done, done);
        } else {
          // clipboard API が使えない環境向けの退避策
          var ta = document.createElement('textarea');
          ta.value = app.url; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta); done();
        }
      });

      // まず自動転送を試す
      location.replace(app.url);

      // 転送できていれば このページは破棄されるので下は動かない。
      // 残っている = 遮断されたということなので、手動の導線を出す。
      setTimeout(showFallback, 1200);
    }
  </script>
</body>
</html>
